<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - UPT SPF SD INPRES KARUWISI 2</title>

    <!-- Ultra-fast DNS Resolution & TLS Handshake (Vercel Optimization) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://unpkg.com">

    <link rel="stylesheet" href="./style.css?v=3.3">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Tambahkan library SheetJS untuk export Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="./config.js"></script>
    <style>
        @media print {
            body * {
                visibility: hidden;
            }

            #qrcode,
            #qrcode * {
                visibility: visible;
            }

            #qrcode {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%) scale(2);
            }
        }
    </style>
</head>

<body>
    <!-- Premium Top Navigation -->
    <nav class="card" style="border-radius: 0; border-left: none; border-right: none; border-top: none;">
        <div class="container py-2 flex justify-between items-center md:flex-col md:gap-4">
            <div class="flex items-center gap-3">
                <i data-lucide="layout-dashboard" class="text-primary" style="width: 28px; height: 28px;"></i>
                <div>
                    <h1 class="text-xl m-0 font-extrabold" style="letter-spacing: -0.02em;">UPT SPF SD INPRES KARUWISI 2
                    </h1>
                    <p class="text-xs text-muted font-medium">Dashboard Administrator</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <div
                        style="width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold;">
                        A</div>
                    <span class="font-semibold text-sm">Admin</span>
                </div>
                <button onclick="logout()" class="btn btn-danger btn-ghost" style="padding: 0.5rem 0.75rem;">
                    <i data-lucide="log-out"></i> Keluar
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Dashboard Area -->
    <div class="container mt-4">

        <!-- Dashboard Summary & Quick Actions -->
        <div class="grid grid-cols-4 md:grid-cols-1 gap-6 mb-8">
            <!-- Total Card -->
            <div class="card p-6 flex flex-col justify-center col-span-1">
                <p class="text-xs text-muted font-bold mb-4" style="text-transform: uppercase; letter-spacing: 0.05em;">
                    Total Data Absen Hari Ini</p>
                <div class="flex items-center justify-between">
                    <span class="text-3xl font-extrabold" id="totalHadir">0</span>
                    <div class="shrink-0"
                        style="width: 56px; height: 56px; border-radius: 16px; background: #e0e7ff; color: var(--primary); display: flex; align-items: center; justify-content: center;">
                        <i data-lucide="users" style="width: 28px; height: 28px;"></i>
                    </div>
                </div>
            </div>

            <!-- Quick Actions / Scanner -->
            <div class="card p-6 col-span-3 md:col-span-1 flex items-center gap-6 md:flex-col">
                <div class="flex-1">
                    <h2 class="text-xl font-bold mb-4">Barcode Absensi Utama</h2>
                    <div class="flex items-center gap-3 mb-6 md:justify-center" style="user-select: none;">
                        <div class="flex flex-col items-center gap-1">
                            <div
                                style="background: #f1f5f9; padding: 0.6rem; border-radius: 50%; color: var(--text-muted);">
                                <i data-lucide="printer" style="width: 20px; height: 20px;"></i>
                            </div>
                            <span class="text-xs font-semibold text-muted">1. Cetak</span>
                        </div>
                        <div style="color: var(--border);"><i data-lucide="chevron-right"
                                style="width: 16px; height: 16px;"></i></div>
                        <div class="flex flex-col items-center gap-1">
                            <div
                                style="background: #f1f5f9; padding: 0.6rem; border-radius: 50%; color: var(--text-muted);">
                                <i data-lucide="map-pin" style="width: 20px; height: 20px;"></i>
                            </div>
                            <span class="text-xs font-semibold text-muted">2. Tempel</span>
                        </div>
                        <div style="color: var(--border);"><i data-lucide="chevron-right"
                                style="width: 16px; height: 16px;"></i></div>
                        <div class="flex flex-col items-center gap-1">
                            <div
                                style="background: #e0e7ff; padding: 0.6rem; border-radius: 50%; color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);">
                                <i data-lucide="scan-line" style="width: 20px; height: 20px;"></i>
                            </div>
                            <span class="text-xs font-bold text-primary">3. Scan</span>
                        </div>
                    </div>
                    <button onclick="printBarcode()" class="btn btn-primary md:btn-block">
                        <i data-lucide="printer"></i> Cetak Barcode (PDF)
                    </button>
                </div>

                <!-- The QR Code visual container -->
                <div class="shrink-0"
                    style="padding: 1rem; background: white; border: 1px solid var(--border); border-radius: var(--radius-md);">
                    <div id="qrcode"></div>
                </div>
            </div>

        </div>

        <!-- Main Log Table -->
        <div class="card p-6">
            <!-- Table Header Actions -->
            <div class="flex justify-between items-end mb-6 md:flex-col md:items-start md:gap-4"
                style="border-bottom: 1px solid var(--border-light); padding-bottom: 1.25rem;">
                <div>
                    <div class="flex items-center gap-3 mb-1">
                        <i data-lucide="clipboard-list" class="text-primary" style="width: 24px; height: 24px;"></i>
                        <h2 class="text-xl m-0 font-bold">Log Kehadiran Guru</h2>
                        <div class="live-indicator">
                            <div class="live-dot"></div> Live
                        </div>
                    </div>
                    <p id="currentDate" class="text-sm text-muted m-0 font-medium"></p>
                </div>

                <div class="flex items-center gap-2 md:w-full md:flex-wrap">
                    <button onclick="loadAttendance()" class="btn btn-outline md:flex-1" id="btnRefresh">
                        <i data-lucide="refresh-cw"></i> Refresh
                    </button>
                    <button onclick="downloadExcel()" class="btn btn-success md:flex-1" title="Download Data ke Excel">
                        <i data-lucide="file-spreadsheet"></i> Download Excel
                    </button>
                </div>
            </div>

            <!-- The Table -->
            <div class="table-container">
                <table id="attendanceTable">
                    <thead>
                        <tr>
                            <th>Waktu Absen</th>
                            <th>Nama Guru</th>
                            <th>Kelas</th>
                            <th>Status Kehadiran</th>
                            <th>Posisi (GPS)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" class="text-center p-8 text-muted">Memuat data secara realtime...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Check auth
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'admin') {
            window.location.href = 'index.html';
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        // Set Current Date
        const today = new Date();
        const dateString = today.toLocaleDateString('en-CA'); // FIX BUG ZONA WAKTU: Pastikan selalu sama dengan waktu lokal Guru
        document.getElementById('currentDate').textContent = today.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        // STATIC Payload for the scanner
        const barcodePayload = JSON.stringify({
            type: "ABSENQ_ATTENDANCE",
            school: "UPT_SPF_SD_INPRES_KARUWISI_2",
            token: "STATIC_SECURE_TOKEN_2026"
        });

        // Generate QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: barcodePayload,
            width: 160,
            height: 160,
            colorDark: "#0f172a",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });

        // Print functionality
        function printBarcode() {
            window.print();
        }

        // Simpan data mentah untuk keperluan Export Excel
        let currentRecordsData = [];
        let previousRecordsLength = 0;
        let isFirstLoad = true;

        // Load Attendance from Google Sheets or LocalStorage (Demo Mode)
        async function loadAttendance(isAuto = false) {
            const tbody = document.querySelector('#attendanceTable tbody');
            const totalHadir = document.getElementById('totalHadir');
            const btn = document.getElementById('btnRefresh');

            if (!isAuto) {
                btn.innerHTML = '<i data-lucide="loader-2" class="spin" style="width: 18px; height: 18px;"></i> Refresh';
                lucide.createIcons();
            }

            let records = [];

            if (CONFIG.GOOGLE_SHEETS_API_URL === "URL_WEB_APP_ANDA_DISINI") {
                // FALLBACK DEMO MODE
                const allRecords = JSON.parse(localStorage.getItem('demo_attendance') || '[]');
                records = allRecords.filter(r => r.date === dateString);

                if (!document.getElementById('demoWarning')) {
                    const warningDiv = document.createElement('div');
                    warningDiv.id = 'demoWarning';
                    warningDiv.className = 'alert alert-warning';
                    warningDiv.innerHTML = '<i data-lucide="alert-triangle" style="width: 24px; height: 24px;"></i><div><strong>Mode Penyimpanan Lokal:</strong> URL Google Sheets belum diatur di config.js. Data saat ini hanya tersimpan di memori browser Anda, bukan di internet.</div>';
                    document.querySelector('.dashboard-grid').parentNode.insertBefore(warningDiv, document.querySelector('.dashboard-grid'));
                    lucide.createIcons();
                }
            } else {
                // REAL MODE (Google Sheets)
                try {
                    // AMBIL SEMUA DATA (Tanpa filter date) untuk menghindari bug format Date di Google Sheets. 
                    // Tambahkan t= timestamp agar browser tidak melakukan cache (selalu update)
                    const fetchUrl = `${CONFIG.GOOGLE_SHEETS_API_URL}?t=${new Date().getTime()}`;
                    const response = await fetch(fetchUrl);
                    let allRecords = await response.json();
                    
                    // Handle jika Google Script membungkus data di dalam objek { data: [...] }
                    if (allRecords && !Array.isArray(allRecords)) {
                        if (Array.isArray(allRecords.data)) allRecords = allRecords.data;
                        else if (Array.isArray(allRecords.records)) allRecords = allRecords.records;
                        else allRecords = [];
                    }

                    // Normalisasi Record (Mengantisipasi header Bahasa Indonesia / Uppercase / Array form)
                    const normalizedRecords = allRecords.map(r => {
                        let n = { date: '', time: '', name: '', kelas: '', status: '', lokasi: '' };
                        if (Array.isArray(r)) {
                            n = { date: r[0], time: r[1], name: r[2], kelas: r[3], status: r[4], lokasi: r[5] };
                        } else {
                            for (let k in r) {
                                let key = k.toLowerCase().trim();
                                if (key.includes('date') || key.includes('tanggal')) n.date = r[k];
                                else if (key.includes('time') || key.includes('waktu')) n.time = r[k];
                                else if (key.includes('name') || key.includes('nama')) n.name = r[k];
                                else if (key.includes('kelas') || key.includes('class')) n.kelas = r[k];
                                else if (key.includes('status') || key.includes('kehadiran')) n.status = r[k];
                                else if (key.includes('lokasi') || key.includes('posisi') || key.includes('gps')) n.lokasi = r[k];
                            }
                        }
                        return n;
                    });

                    // Filter di sisi klien
                    records = normalizedRecords.filter(r => {
                        if (!r.date) return false;
                        let rDateStr = String(r.date);

                        // 1. Sama persis dengan string (e.g., "2026-09-05")
                        if (rDateStr === dateString) return true;
                        if (rDateStr.includes(dateString)) return true;

                        // 2. Format parsing yang paling tangguh
                        try {
                            const d = new Date(rDateStr);
                            if (!isNaN(d.getTime())) {
                                const local = d.toLocaleDateString('en-CA');
                                if (local === dateString) return true;
                                
                                // Format "D/M/YYYY" atau "DD/MM/YYYY" lokal
                                const idLocal = d.toLocaleDateString('id-ID'); // "5/9/2026"
                                const targetId = today.toLocaleDateString('id-ID');
                                if (idLocal === targetId) return true;
                            }
                        } catch (e) { }

                        // 3. Fallback kasar (cari angka tanggal bulan tahun)
                        const [year, month, day] = dateString.split('-');
                        if (rDateStr.includes(year) && rDateStr.includes(parseInt(day).toString())) {
                            return true;
                        }

                        return false;
                    });
                } catch (error) {
                    console.error("Error fetching data:", error);
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--danger); padding: 2rem;">Gagal memuat data dari Google Sheets. Pastikan URL benar.</td></tr>';
                    btn.innerHTML = '<i data-lucide="refresh-cw" style="width: 18px; height: 18px;"></i> Refresh';
                    lucide.createIcons();
                    return;
                }
            }

            currentRecordsData = records; // Simpan ke memori global
            totalHadir.textContent = records.length;
            tbody.innerHTML = '';

            if (records.length === 0) {
                let debugInfo = "";
                try {
                    const rawJson = JSON.stringify(allRecords || {}).substring(0, 1000);
                    debugInfo = `<div style="text-align:left; background:#f1f5f9; padding:10px; border-radius:8px; font-size:11px; max-width:100%; overflow-x:auto; margin-top:1rem; border:1px solid var(--danger); color:var(--text-main);">
                        <strong style="color:var(--danger);"><i data-lucide="bug" style="width:14px;height:14px;vertical-align:middle;"></i> MODE DIAGNOSIS (SISTEM MEMBACA 0 DATA HARI INI)</strong><br><br>
                        <strong>Data Mentah dari Google Script:</strong><br>
                        ${rawJson}<br><br>
                        <strong>Tanggal yang dicari sistem:</strong> ${dateString}<br>
                    </div>`;
                } catch(e) {}
                
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 2rem;">
                    Belum ada log absen hari ini.
                    ${debugInfo}
                </td></tr>`;
            } else {
                records.forEach(record => {
                    const tr = document.createElement('tr');
                    let statusBadge = '';
                    if (record.status === 'Datang') {
                        statusBadge = '<span class="badge badge-success"><i data-lucide="log-in" style="width: 12px; height: 12px;"></i> Datang</span>';
                    } else if (record.status === 'Pulang') {
                        statusBadge = '<span class="badge badge-warning"><i data-lucide="log-out" style="width: 12px; height: 12px;"></i> Pulang</span>';
                    } else {
                        statusBadge = `<span class="badge badge-primary">${record.status}</span>`;
                    }

                    let lokasiText = record.lokasi || "Tidak ada data";
                    let lokasiHtml = `<td style="font-size: 0.85rem; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${lokasiText}">${lokasiText}</td>`;

                    // Jika berisi kata GPS, buat jadi link peta
                    if (lokasiText.startsWith("GPS: ")) {
                        const coords = lokasiText.replace("GPS: ", "");
                        lokasiHtml = `<td style="font-size: 0.85rem;"><a href="https://maps.google.com/?q=${coords}" target="_blank" style="color: var(--primary); text-decoration: none;"><i data-lucide="map-pin" style="width: 14px; height: 14px; vertical-align: middle;"></i> Buka Peta</a></td>`;
                    } else if (lokasiText !== "Tidak ada data" && !lokasiText.includes("tidak diketahui")) {
                        lokasiHtml = `<td style="font-size: 0.85rem; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${lokasiText}"><i data-lucide="map-pin" style="width: 12px; height: 12px; color: var(--primary); vertical-align: middle;"></i> ${lokasiText}</td>`;
                    }

                    tr.innerHTML = `
                        <td style="font-weight: 500;">${record.time}</td>
                        <td style="font-weight: 700; color: var(--text-main);">${record.name}</td>
                        <td>${record.kelas}</td>
                        <td>${statusBadge}</td>
                        ${lokasiHtml}
                    `;
                    tbody.appendChild(tr);
                });
            }

            if (!isAuto) {
                btn.innerHTML = '<i data-lucide="refresh-cw" style="width: 18px; height: 18px;"></i> Refresh';
                lucide.createIcons();
            }

            // Jika ada data baru yang masuk (dan bukan load pertama kali)
            if (!isFirstLoad && records.length > previousRecordsLength) {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + 0.1);

                    gain.gain.setValueAtTime(0.5, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start();
                    osc.stop(ctx.currentTime + 0.5);
                } catch (e) { }
            }

            previousRecordsLength = records.length;
            isFirstLoad = false;
        }

        // Fungsi Download Excel menggunakan SheetJS
        function downloadExcel() {
            if (currentRecordsData.length === 0) {
                alert("Tidak ada data absen hari ini untuk di-download.");
                return;
            }

            // Siapkan data untuk Excel
            const excelData = currentRecordsData.map((row, index) => ({
                "No": index + 1,
                "Tanggal": row.date,
                "Waktu": row.time,
                "Nama Guru": row.name,
                "Kelas": row.kelas,
                "Status": row.status,
                "Lokasi (Alamat / GPS)": row.lokasi || "-"
            }));

            // Buat worksheet dan workbook
            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Absensi Hari Ini");

            // Lebarkan kolom biar rapi
            const wscols = [
                { wch: 5 },  // No
                { wch: 15 }, // Tanggal
                { wch: 15 }, // Waktu
                { wch: 30 }, // Nama Guru
                { wch: 10 }, // Kelas
                { wch: 15 }, // Status
                { wch: 50 }  // Lokasi
            ];
            worksheet['!cols'] = wscols;

            // Buat file dan trigger download
            XLSX.writeFile(workbook, `Laporan_Absensi_${dateString}.xlsx`);
        }

        loadAttendance();

        // --- FITUR LIVE SYNC (AUTO-POLLING 3 DETIK) ---
        setInterval(() => {
            loadAttendance(true);
        }, 3000);

        // --- FITUR GANTI PASSWORD ---
        function showChangePasswordModal() {
            document.getElementById('passwordModal').style.display = 'flex';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }

        function saveNewPassword() {
            const newPass = document.getElementById('newPassword').value.trim();
            const confirmPass = document.getElementById('confirmPassword').value.trim();

            if (newPass.length < 4) {
                alert("Password terlalu pendek (Minimal 4 karakter)");
                return;
            }
            if (newPass !== confirmPass) {
                alert("Konfirmasi password tidak cocok!");
                return;
            }

            // Simpan password ke LocalStorage
            const customPasswords = JSON.parse(localStorage.getItem('custom_passwords') || '{}');
            customPasswords['admin'] = newPass; // Admin selalu username 'admin'
            localStorage.setItem('custom_passwords', JSON.stringify(customPasswords));

            alert("Password berhasil diubah!");
            closePasswordModal();
        }
    </script>

    <!-- Modal Ganti Password -->
    <div id="passwordModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Ganti Password</h3>
            <div class="form-group" style="text-align: left;">
                <label>Password Baru</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Minimal 4 karakter">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Konfirmasi Password Baru</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi password baru">
            </div>
            <div class="modal-buttons">
                <button onclick="closePasswordModal()" class="btn btn-outline"
                    style="border: 1px solid var(--border); padding: 0.5rem 1rem;">Batal</button>
                <button onclick="saveNewPassword()" class="btn btn-primary"
                    style="padding: 0.5rem 1rem;">Simpan</button>
            </div>
        </div>
    </div>

    <style>
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: white;
            padding: 2rem;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
        }

        .modal-card h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .modal-card input {
            margin-bottom: 1rem;
        }

        .modal-buttons {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 1rem;
        }
    </style>
</body>

</html>
