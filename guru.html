<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Guru - UPT SPF SD INPRES KARUWISI 2</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="./config.js"></script>
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <div class="school-header" style="margin-bottom: 1rem; padding-bottom: 0.5rem;">
            <h2 style="margin: 0; color: var(--primary);">UPT SPF SD INPRES KARUWISI 2</h2>
        </div>

        <nav class="navbar" style="border-radius: 8px; margin-bottom: 2rem;">
            <div class="nav-brand">
                <i data-lucide="scan"></i> Scanner Guru
            </div>
            <div class="nav-user">
                <span id="userName" style="font-weight: 500;">Guru</span>
                <span id="userKelas" class="badge badge-warning" style="background: rgba(255,255,255,0.2); border: none; color: white;">Kelas</span>
                <button onclick="showChangePasswordModal()" class="btn btn-outline" style="padding: 0.5rem 1rem; margin-right: 0.5rem; color: var(--text-main); border: 1px solid var(--border);">
                    <i data-lucide="key" style="width: 16px; height: 16px;"></i> Password
                </button>
                <button onclick="logout()" class="btn btn-danger" style="padding: 0.5rem 1rem;">
                    <i data-lucide="log-out" style="width: 16px; height: 16px;"></i> Keluar
                </button>
            </div>
        </nav>

        <!-- Pilihan Absen Datang/Pulang -->
        <div id="selectionMode" style="text-align: center; margin-bottom: 2rem;">
            <h2 style="margin-bottom: 1.5rem;">Pilih Jenis Absen</h2>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1rem;">
                <button onclick="startScanner('Datang')" class="btn btn-primary" style="padding: 1rem 2rem; font-size: 1.1rem; width: 45%;">
                    <i data-lucide="log-in"></i> Datang
                </button>
                <button onclick="startScanner('Pulang')" class="btn btn-warning" style="padding: 1rem 2rem; font-size: 1.1rem; color: #fff; width: 45%;">
                    <i data-lucide="log-out"></i> Pulang
                </button>
            </div>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <button onclick="showAbsenAlternatifModal('Sakit')" class="btn btn-danger" style="padding: 1rem 2rem; font-size: 1.1rem; width: 45%; background: var(--danger); color: white;">
                    <i data-lucide="thermometer"></i> Sakit
                </button>
                <button onclick="showAbsenAlternatifModal('Izin')" class="btn btn-outline" style="padding: 1rem 2rem; font-size: 1.1rem; width: 45%; border: 1px solid var(--border); color: var(--text-main); background: var(--surface);">
                    <i data-lucide="file-text"></i> Izin
                </button>
            </div>
        </div>

        <!-- Area Scanner (Hidden awalnya) -->
        <div id="scannerArea" style="display: none;">
            <div style="text-align: center; margin-bottom: 1rem;">
                <h2 id="scannerTitle">Kamera Aktif</h2>
                <p>Arahkan kamera ke Barcode utama sekolah.</p>
                <button onclick="cancelScanner()" class="btn" style="margin-top: 1rem; background: var(--border);">Batal</button>
            </div>

            <div class="card" style="padding: 1.5rem;">
                <div class="scanner-container">
                    <div id="reader"></div>
                </div>
            <!-- Hasil Scan -->
            <div id="resultCard" class="card" style="display: none; text-align: center; border-top: 4px solid var(--primary);">
                <div id="resultIcon" style="margin-bottom: 1rem;"></div>
                <h3 id="resultTitle" style="margin-bottom: 0.5rem; color: var(--text-main);">Berhasil!</h3>
                <p id="resultMessage" style="color: var(--text-muted); line-height: 1.5;"></p>
            </div>
        </div>
    </div>

    <!-- Modal Ganti Password -->
    <div id="passwordModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Ganti Password</h3>
            <div class="form-group" style="text-align: left;">
                <label>Password Baru</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Minimal 4 karakter">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Konfirmasi Password Baru</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi password baru">
            </div>
            <div class="modal-buttons">
                <button onclick="closePasswordModal()" class="btn btn-outline" style="border: 1px solid var(--border); padding: 0.5rem 1rem;">Batal</button>
                <button onclick="saveNewPassword()" class="btn btn-primary" style="padding: 0.5rem 1rem;">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Modal Absen Alternatif (Izin/Sakit) -->
    <div id="absenAlternatifModal" class="modal-overlay">
        <div class="modal-card">
            <h3 id="absenAlternatifTitle">Form Izin / Sakit</h3>
            <div class="form-group" style="text-align: left;">
                <label>Alasan / Keterangan Tambahan</label>
                <textarea id="absenAlternatifReason" class="form-control" rows="3" placeholder="Masukkan alasan (misal: Demam, Rapat di Dinas, dll)"></textarea>
            </div>
            <div class="modal-buttons">
                <button onclick="closeAbsenAlternatifModal()" class="btn btn-outline" style="border: 1px solid var(--border); padding: 0.5rem 1rem;">Batal</button>
                <button onclick="submitAbsenAlternatif()" class="btn btn-primary" style="padding: 0.5rem 1rem;">Kirim Absen</button>
            </div>
        </div>
    </div>

    <script>
        // --- FITUR IZIN & SAKIT ---
        let statusAlternatif = "";
        
        function showAbsenAlternatifModal(status) {
            statusAlternatif = status;
            document.getElementById('absenAlternatifTitle').textContent = `Form Pengajuan ${status}`;
            document.getElementById('absenAlternatifReason').value = '';
            document.getElementById('absenAlternatifModal').style.display = 'flex';
        }

        function closeAbsenAlternatifModal() {
            document.getElementById('absenAlternatifModal').style.display = 'none';
        }

        async function submitAbsenAlternatif() {
            if (isProcessing) return;
            isProcessing = true;
            
            const reason = document.getElementById('absenAlternatifReason').value.trim();
            const lokasiText = reason ? `Alasan: ${reason}` : `Alasan: Tidak ada keterangan`;
            
            closeAbsenAlternatifModal();
            document.getElementById('selectionMode').style.display = 'none';
            
            const resultCard = document.getElementById('resultCard');
            const resultIcon = document.getElementById('resultIcon');
            const resultTitle = document.getElementById('resultTitle');
            const resultMessage = document.getElementById('resultMessage');
            
            resultCard.style.display = 'block';
            resultIcon.innerHTML = `<i data-lucide="loader" class="spin" style="width: 48px; height: 48px; color: var(--primary);"></i>`;
            resultTitle.textContent = "Memproses...";
            resultMessage.textContent = `Mengirim data ${statusAlternatif} ke server...`;
            lucide.createIcons();

            try {
                const today = new Date();
                const dateString = today.toLocaleDateString('en-CA');
                const timeString = today.toLocaleTimeString('id-ID', { hour12: false });
                
                const payload = {
                    date: dateString,
                    time: timeString,
                    name: user.name,
                    kelas: user.kelas || "-",
                    status: statusAlternatif,
                    lokasi: lokasiText
                };

                if (CONFIG.GOOGLE_SHEETS_API_URL === "URL_WEB_APP_ANDA_DISINI") {
                    const allRecords = JSON.parse(localStorage.getItem('demo_attendance') || '[]');
                    allRecords.push(payload);
                    localStorage.setItem('demo_attendance', JSON.stringify(allRecords));
                } else {
                    await fetch(CONFIG.GOOGLE_SHEETS_API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                }

                playSuccessBeep();
                resultIcon.innerHTML = `<i data-lucide="check-circle" style="width: 48px; height: 48px; color: var(--success);"></i>`;
                resultTitle.textContent = "Berhasil!";
                resultMessage.innerHTML = `Terima kasih <strong>${user.name}</strong>.<br>Absen <strong>${statusAlternatif}</strong> Anda tercatat pukul ${timeString}.`;
                resultCard.style.borderTopColor = 'var(--success)';
                
            } catch (error) {
                resultIcon.innerHTML = `<i data-lucide="x-circle" style="width: 48px; height: 48px; color: var(--danger);"></i>`;
                resultTitle.textContent = "Gagal!";
                resultMessage.textContent = "Koneksi terputus. Pastikan internet Anda lancar dan coba lagi.";
                resultCard.style.borderTopColor = 'var(--danger)';
            }
            lucide.createIcons();

            setTimeout(() => {
                resultCard.style.display = 'none';
                document.getElementById('selectionMode').style.display = 'block';
                isProcessing = false;
            }, 6000);
        }

        lucide.createIcons();

        // Check auth
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'guru') {
            window.location.href = 'index.html';
        }
        document.getElementById('userName').textContent = user.name;
        document.getElementById('userKelas').textContent = user.kelas;

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        let isProcessing = false;
        let selectedStatus = "";
        let html5QrcodeScanner = null;
        let currentLocation = "Lokasi tidak diketahui";

        function startScanner(status) {
            selectedStatus = status;
            document.getElementById('selectionMode').style.display = 'none';
            
            const scannerArea = document.getElementById('scannerArea');
            scannerArea.style.display = 'block';
            document.getElementById('scannerTitle').textContent = `Mencari Lokasi... (Harap Tunggu)`;
            document.getElementById('resultCard').style.display = 'none';

            // Dapatkan Lokasi GPS dengan senyap dan cepat
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
                            const data = await response.json();
                            currentLocation = data.display_name || `GPS: ${lat}, ${lon}`;
                        } catch (err) {
                            console.error("Gagal reverse geocoding:", err);
                            currentLocation = `GPS: ${lat}, ${lon}`;
                        }
                        
                        document.getElementById('scannerTitle').textContent = `Scanner (Absen ${status})`;
                        initScanner();
                    },
                    (error) => {
                        console.warn("Geolocation error:", error);
                        // Hapus alert agar tidak mengganggu, langsung fallback saja
                        currentLocation = "Akses Lokasi Ditolak / GPS Tidak Aktif";
                        document.getElementById('scannerTitle').textContent = `Scanner (Absen ${status})`;
                        initScanner();
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 } // Timeout dipercepat menjadi 5 detik
                );
            } else {
                currentLocation = "Browser tidak mendukung GPS";
                document.getElementById('scannerTitle').textContent = `Scanner (Absen ${status})`;
                initScanner();
            }
        }

        function initScanner() {
            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader",
                    { 
                        fps: 30, // Ditingkatkan ke 30 FPS agar real-time dan super cepat
                        qrbox: {width: 250, height: 250}, 
                        aspectRatio: 1.0,
                        videoConstraints: { facingMode: "environment" } // Paksa kamera belakang
                    },
                    false);
                html5QrcodeScanner.render(onScanSuccess, (err) => {});
                
                // Terjemahkan UI Scanner ke Bahasa Indonesia
                setInterval(() => {
                    const btnPerm = document.getElementById('html5-qrcode-button-camera-permission');
                    if (btnPerm && btnPerm.innerText.includes('Request')) btnPerm.innerText = 'Izinkan Akses Kamera';
                    
                    const btnStart = document.getElementById('html5-qrcode-button-camera-start');
                    if (btnStart && btnStart.innerText.includes('Start')) btnStart.innerText = 'Mulai Kamera';
                    
                    const btnStop = document.getElementById('html5-qrcode-button-camera-stop');
                    if (btnStop && btnStop.innerText.includes('Stop')) btnStop.innerText = 'Matikan Kamera';
                    
                    const fileScan = document.getElementById('html5-qrcode-anchor-scan-type-change');
                    if (fileScan) fileScan.style.display = 'none'; // Sembunyikan scan via file
                }, 500);
            } else {
                html5QrcodeScanner.resume();
            }
        }

        function cancelScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.pause();
            }
            document.getElementById('selectionMode').style.display = 'block';
            document.getElementById('scannerArea').style.display = 'none';
        }

        function playSuccessBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.2); // Beep selama 0.2 detik
            } catch(e) {}
        }

        async function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            
            isProcessing = true;
            html5QrcodeScanner.pause();
            playSuccessBeep(); // Bunyikan Beep!
            
            const resultCard = document.getElementById('resultCard');
            const resultIcon = document.getElementById('resultIcon');
            const resultTitle = document.getElementById('resultTitle');
            const resultMessage = document.getElementById('resultMessage');
            
            resultCard.style.display = 'block';
            resultIcon.innerHTML = `<i data-lucide="loader" class="spin" style="width: 48px; height: 48px; color: var(--primary);"></i>`;
            resultTitle.textContent = "Memproses...";
            resultMessage.textContent = "Mengirim data ke server...";
            lucide.createIcons();

            try {
                const payload = JSON.parse(decodedText);
                const today = new Date();
                const dateString = today.toLocaleDateString('en-CA');
                const timeString = today.toLocaleTimeString('id-ID', { hour12: false });
                
                if (payload.type === "ABSENQ_ATTENDANCE" && payload.school === "UPT_SPF_SD_INPRES_KARUWISI_2") {
                    
                    if (CONFIG.GOOGLE_SHEETS_API_URL === "URL_WEB_APP_ANDA_DISINI") {
                        const allRecords = JSON.parse(localStorage.getItem('demo_attendance') || '[]');
                        allRecords.push({
                            date: dateString,
                            time: timeString,
                            name: user.name,
                            kelas: user.kelas,
                            status: selectedStatus,
                            lokasi: currentLocation
                        });
                        localStorage.setItem('demo_attendance', JSON.stringify(allRecords));
                    } else {
                        // REAL MODE: Send to Google Sheets Apps Script
                        const response = await fetch(CONFIG.GOOGLE_SHEETS_API_URL, {
                            method: 'POST',
                            mode: 'no-cors', // Penting untuk Apps Script dari statis Vercel
                            headers: {
                                // MENGGUNAKAN text/plain AGAR TIDAK DIBLOKIR PREFLIGHT CORS OLEH BROWSER
                                'Content-Type': 'text/plain;charset=utf-8' 
                            },
                            body: JSON.stringify({
                                date: dateString,
                                time: timeString,
                                name: user.name,
                                kelas: user.kelas,
                                status: selectedStatus,
                                lokasi: currentLocation
                            })
                        });
                    }
                    
                    resultCard.style.borderTopColor = 'var(--success)';
                    resultIcon.innerHTML = '<i data-lucide="check-circle" style="width: 64px; height: 64px; color: var(--success);"></i>';
                    resultTitle.textContent = "Berhasil!";
                    
                    if (CONFIG.GOOGLE_SHEETS_API_URL === "URL_WEB_APP_ANDA_DISINI") {
                        resultMessage.innerHTML = `Absen ${selectedStatus} dicatat.<br><small style="color:var(--text-muted)">Lokasi: ${currentLocation}</small><br><br><small style="color:var(--danger)">[Penyimpanan Lokal Aktif]</small>`;
                    } else {
                        resultMessage.innerHTML = `Absen ${selectedStatus} berhasil dicatat.<br><small style="color:var(--text-muted)">Lokasi: ${currentLocation}</small>`;
                    }
                    
                } else {
                    throw new Error("Barcode tidak valid untuk sekolah ini.");
                }
            } catch (err) {
                resultCard.style.borderTopColor = 'var(--danger)';
                resultIcon.innerHTML = '<i data-lucide="x-circle" style="width: 64px; height: 64px; color: var(--danger);"></i>';
                resultTitle.textContent = "Gagal";
                resultMessage.textContent = "Barcode salah atau gagal menghubungi server.";
                console.error(err);
            }
            
            lucide.createIcons();

            // Tahan notifikasi selama 6 detik agar guru sempat melihatnya
            setTimeout(() => {
                resultCard.style.display = 'none';
                document.getElementById('selectionMode').style.display = 'block';
                isProcessing = false;
            }, 6000);
        }

        // --- FITUR GANTI PASSWORD ---
        function showChangePasswordModal() {
            document.getElementById('passwordModal').style.display = 'flex';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').style.display = 'none';
        }

        function saveNewPassword() {
            const newPass = document.getElementById('newPassword').value.trim();
            const confirmPass = document.getElementById('confirmPassword').value.trim();
            
            if (newPass.length < 4) {
                alert("Password terlalu pendek (Minimal 4 karakter)");
                return;
            }
            if (newPass !== confirmPass) {
                alert("Konfirmasi password tidak cocok!");
                return;
            }
            
            // Simpan password ke LocalStorage
            const customPasswords = JSON.parse(localStorage.getItem('custom_passwords') || '{}');
            customPasswords[user.username] = newPass;
            localStorage.setItem('custom_passwords', JSON.stringify(customPasswords));
            
            alert("Password berhasil diubah!");
            closePasswordModal();
        }
    </script>
    
    <style>
        #reader { border-radius: 8px; overflow: hidden; border: none !important; }
        #reader button {
            background: var(--primary); color: white; border: none; padding: 8px 16px;
            border-radius: 4px; cursor: pointer; font-family: 'Roboto', sans-serif; margin: 10px;
        }
        #reader select {
            background: #fff; color: var(--text-primary); border: 1px solid var(--border);
            padding: 8px; border-radius: 4px; font-family: 'Roboto', sans-serif; margin: 10px;
        }
        #reader a { color: var(--primary); display: none; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-card {
            background: white; padding: 2rem; border-radius: var(--radius-lg);
            width: 90%; max-width: 400px; box-shadow: var(--shadow-lg);
        }
        .modal-card h3 { margin-top: 0; margin-bottom: 1rem; color: var(--text-main); }
        .modal-card input { margin-bottom: 1rem; }
        .modal-buttons { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
    </style>
</body>
</html>
