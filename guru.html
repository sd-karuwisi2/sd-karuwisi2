<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Guru - UPT SPF SD INPRES KARUWISI 2</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="./config.js"></script>
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <div class="school-header" style="margin-bottom: 1rem; padding-bottom: 0.5rem;">
            <h2 style="margin: 0; color: var(--primary);">UPT SPF SD INPRES KARUWISI 2</h2>
        </div>

        <nav class="navbar" style="border-radius: 8px; margin-bottom: 2rem;">
            <div class="nav-brand">
                <i data-lucide="scan"></i> Scanner Guru
            </div>
            <div class="nav-user">
                <span id="userName" style="font-weight: 500;">Guru</span>
                <span id="userKelas" class="badge badge-warning" style="background: rgba(255,255,255,0.2); border: none; color: white;">Kelas</span>
                <button onclick="logout()" class="btn btn-danger" style="padding: 0.5rem 1rem;">
                    <i data-lucide="log-out" style="width: 16px; height: 16px;"></i> Keluar
                </button>
            </div>
        </nav>

        <!-- Pilihan Absen Datang/Pulang -->
        <div id="selectionMode" style="text-align: center; margin-bottom: 2rem;">
            <h2 style="margin-bottom: 1.5rem;">Pilih Jenis Absen</h2>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button onclick="startScanner('Datang')" class="btn btn-primary" style="padding: 1rem 2rem; font-size: 1.1rem;">
                    <i data-lucide="log-in"></i> Absen Datang
                </button>
                <button onclick="startScanner('Pulang')" class="btn btn-warning" style="padding: 1rem 2rem; font-size: 1.1rem; color: #fff;">
                    <i data-lucide="log-out"></i> Absen Pulang
                </button>
            </div>
        </div>

        <!-- Area Scanner (Hidden awalnya) -->
        <div id="scannerArea" style="display: none;">
            <div style="text-align: center; margin-bottom: 1rem;">
                <h2 id="scannerTitle">Kamera Aktif</h2>
                <p>Arahkan kamera ke Barcode utama sekolah.</p>
                <button onclick="cancelScanner()" class="btn" style="margin-top: 1rem; background: var(--border);">Batal</button>
            </div>

            <div class="card" style="padding: 1.5rem;">
                <div class="scanner-container">
                    <div id="reader"></div>
                </div>
            </div>
        </div>

        <div id="resultCard" class="scan-result-card card" style="display: none; border-top: 4px solid var(--primary);">
            <div id="resultIcon" style="margin-bottom: 1rem;"></div>
            <h3 id="resultTitle"></h3>
            <p id="resultMessage" style="margin-top: 0.5rem;"></p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Check auth
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'guru') {
            window.location.href = 'index.html';
        }
        document.getElementById('userName').textContent = user.name;
        document.getElementById('userKelas').textContent = user.kelas;

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        let isProcessing = false;
        let selectedStatus = "";
        let html5QrcodeScanner = null;
        let currentLocation = "Lokasi tidak diketahui";

        function startScanner(status) {
            selectedStatus = status;
            document.getElementById('selectionMode').style.display = 'none';
            
            const scannerArea = document.getElementById('scannerArea');
            scannerArea.style.display = 'block';
            document.getElementById('scannerTitle').textContent = `Mencari Lokasi... (Harap Tunggu)`;
            document.getElementById('resultCard').style.display = 'none';

            // Dapatkan Lokasi GPS dengan senyap dan cepat
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        try {
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`);
                            const data = await response.json();
                            currentLocation = data.display_name || `GPS: ${lat}, ${lon}`;
                        } catch (err) {
                            console.error("Gagal reverse geocoding:", err);
                            currentLocation = `GPS: ${lat}, ${lon}`;
                        }
                        
                        document.getElementById('scannerTitle').textContent = `Scanner (Absen ${status})`;
                        initScanner();
                    },
                    (error) => {
                        console.warn("Geolocation error:", error);
                        // Hapus alert agar tidak mengganggu, langsung fallback saja
                        currentLocation = "Akses Lokasi Ditolak / GPS Tidak Aktif";
                        document.getElementById('scannerTitle').textContent = `Scanner (Absen ${status})`;
                        initScanner();
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 } // Timeout dipercepat menjadi 5 detik
                );
            } else {
                currentLocation = "Browser tidak mendukung GPS";
                document.getElementById('scannerTitle').textContent = `Scanner (Absen ${status})`;
                initScanner();
            }
        }

        function initScanner() {
            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader",
                    { fps: 10, qrbox: {width: 250, height: 250}, aspectRatio: 1.0 },
                    false);
                html5QrcodeScanner.render(onScanSuccess, (err) => {});
            } else {
                html5QrcodeScanner.resume();
            }
        }

        function cancelScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.pause();
            }
            document.getElementById('selectionMode').style.display = 'block';
            document.getElementById('scannerArea').style.display = 'none';
        }

        async function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            
            isProcessing = true;
            html5QrcodeScanner.pause();
            
            const resultCard = document.getElementById('resultCard');
            const resultIcon = document.getElementById('resultIcon');
            const resultTitle = document.getElementById('resultTitle');
            const resultMessage = document.getElementById('resultMessage');
            
            document.getElementById('scannerArea').style.display = 'none';
            resultCard.style.display = 'block';
            resultCard.style.borderTopColor = 'var(--primary)';
            resultIcon.innerHTML = '<i data-lucide="loader-2" class="spin" style="width: 64px; height: 64px; color: var(--primary);"></i>';
            resultTitle.textContent = "Memproses...";
            resultMessage.textContent = `Menyimpan absensi ${selectedStatus}...`;
            lucide.createIcons();
            
            try {
                // The barcode should match the static payload
                const payload = JSON.parse(decodedText);
                const today = new Date().toISOString().split('T')[0];
                const timeString = new Date().toLocaleTimeString('id-ID');
                
                if (payload.type === "ABSENQ_ATTENDANCE" && payload.school === "UPT_SPF_SD_INPRES_KARUWISI_2") {
                    
                    if (CONFIG.GOOGLE_SHEETS_API_URL === "URL_WEB_APP_ANDA_DISINI") {
                        // FALLBACK DEMO MODE
                        const allRecords = JSON.parse(localStorage.getItem('demo_attendance') || '[]');
                        allRecords.push({
                            date: today,
                            time: timeString,
                            name: user.name,
                            kelas: user.kelas,
                            status: selectedStatus,
                            lokasi: currentLocation
                        });
                        localStorage.setItem('demo_attendance', JSON.stringify(allRecords));
                    } else {
                        // REAL MODE: Send to Google Sheets Apps Script
                        const response = await fetch(CONFIG.GOOGLE_SHEETS_API_URL, {
                            method: 'POST',
                            mode: 'no-cors', // Penting untuk Apps Script dari statis Vercel
                            headers: {
                                // MENGGUNAKAN text/plain AGAR TIDAK DIBLOKIR PREFLIGHT CORS OLEH BROWSER
                                'Content-Type': 'text/plain;charset=utf-8' 
                            },
                            body: JSON.stringify({
                                date: today,
                                time: timeString,
                                name: user.name,
                                kelas: user.kelas,
                                status: selectedStatus,
                                lokasi: currentLocation
                            })
                        });
                    }
                    
                    resultCard.style.borderTopColor = 'var(--success)';
                    resultIcon.innerHTML = '<i data-lucide="check-circle" style="width: 64px; height: 64px; color: var(--success);"></i>';
                    resultTitle.textContent = "Berhasil!";
                    
                    if (CONFIG.GOOGLE_SHEETS_API_URL === "URL_WEB_APP_ANDA_DISINI") {
                        resultMessage.innerHTML = `Absen ${selectedStatus} dicatat.<br><small style="color:var(--text-muted)">Lokasi: ${currentLocation}</small><br><br><small style="color:var(--danger)">[Penyimpanan Lokal Aktif]</small>`;
                    } else {
                        resultMessage.innerHTML = `Absen ${selectedStatus} berhasil dicatat.<br><small style="color:var(--text-muted)">Lokasi: ${currentLocation}</small>`;
                    }
                    
                } else {
                    throw new Error("Barcode tidak valid untuk sekolah ini.");
                }
            } catch (err) {
                resultCard.style.borderTopColor = 'var(--danger)';
                resultIcon.innerHTML = '<i data-lucide="x-circle" style="width: 64px; height: 64px; color: var(--danger);"></i>';
                resultTitle.textContent = "Gagal";
                resultMessage.textContent = "Barcode salah atau gagal menghubungi server.";
                console.error(err);
            }
            
            lucide.createIcons();

            // Return to selection mode after 3 seconds
            setTimeout(() => {
                resultCard.style.display = 'none';
                document.getElementById('selectionMode').style.display = 'block';
                isProcessing = false;
            }, 3000);
        }
    </script>
    
    <style>
        #reader { border-radius: 8px; overflow: hidden; border: none !important; }
        #reader button {
            background: var(--primary); color: white; border: none; padding: 8px 16px;
            border-radius: 4px; cursor: pointer; font-family: 'Roboto', sans-serif; margin: 10px;
        }
        #reader select {
            background: #fff; color: var(--text-primary); border: 1px solid var(--border);
            padding: 8px; border-radius: 4px; font-family: 'Roboto', sans-serif; margin: 10px;
        }
        #reader a { color: var(--primary); display: none; }
    </style>
</body>
</html>
